    background-repeat:no-repeat;
    background-position:bottom center;
    background-size:cover;
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Source Sans 3', sans-serif;
    line-height:1.5;
  }
  h1,h2,h3{
    font-family:'Fraunces', serif;
    color:var(--ocean);
    margin:0;
  }
  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    background:linear-gradient(160deg, var(--ocean-deep) 0%, var(--ocean) 55%, var(--steel) 100%);
    color:#fff;
    padding:56px 32px 74px;
    overflow:hidden;
  }
  .hero-inner{
    max-width:920px;
    margin:0 auto;
    position:relative;
    z-index:2;
  }
  .hero .eyebrow{
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--medblue);
    margin-bottom:10px;
  }
  .hero h1{
    color:#fff;
    font-size:clamp(32px, 5vw, 48px);
    font-weight:600;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:16px;
  }
  .hero-logo-chip{
    display:inline-flex;
    align-items:center;
    background:#fff;
    border-radius:10px;
    padding:8px 16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.18);
  }
  .hero-logo-chip img{
    display:block;
    height:clamp(30px, 5vw, 42px);
    width:auto;
  }
  .footer-logo{
    max-width:170px;
    width:55%;
    height:auto;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,0.25));
  }
  .print-btn{
    position:fixed;
    top:16px;
    right:16px;
    z-index:50;
    background:#fff;
    color:var(--ocean);
    border:1px solid var(--line);
    border-radius:7px;
    padding:8px 14px;
    font-size:13.5px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    box-shadow:0 2px 8px rgba(15,58,87,0.15);
  }
  .print-btn:hover{background:var(--seafoam);}
  .card{position:relative;}
  .corner-logo{
    position:absolute;
    bottom:14px;
    right:16px;
    width:64px;
    height:auto;
    opacity:0.55;
    pointer-events:none;
    z-index:1;
  }
  @media print{
    .print-btn{display:none !important;}
    .corner-logo{display:none !important;}
    body{background-image:none !important; background-color:#fff !important;}
    .card{box-shadow:none !important; page-break-inside:avoid;}
    .trip-card{page-break-inside:avoid;}
    .hero{background:none !important; color:var(--ink) !important; padding:16px 0 !important;}
    .hero p{display:none !important;}
    .hero-wave{display:none !important;}
    .hero-logo-chip{box-shadow:none !important;}
  }
  .hero p{
    max-width:52ch;
    color:#DCEBF5;
    font-size:16px;
    margin-top:14px;
  }
  .hero-wave{
    position:absolute;
    bottom:-2px; left:0; width:100%;
    height:64px;
    z-index:1;
  }
  /* ---------- Layout ---------- */
  .wrap{
    max-width:920px;
    margin:-40px auto 80px;
    padding:0 24px;
    position:relative;
    z-index:3;
  }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:28px;
    margin-bottom:24px;
    box-shadow: 0 1px 2px rgba(15,58,87,0.06);
  }
  /* ---------- Upload ---------- */
  .dropzone{
    border:1.5px dashed var(--medblue);
    border-radius:10px;
    padding:36px 20px;
    text-align:center;
    cursor:pointer;
    background:var(--seafoam);
    transition:border-color .15s ease, background .15s ease;
  }
  .dropzone.drag{
    border-color:var(--ocean);
    background:var(--lightblue);
  }
  .dropzone strong{color:var(--ocean);}
  .dropzone input{display:none;}
  .filename{
    margin-top:12px;
    font-size:14px;
    color:var(--gray);
  }
  details.hint{margin-top:16px; font-size:14px; color:var(--gray);}
  details.hint summary{cursor:pointer; color:var(--ocean); font-weight:600;}
  details.hint table{margin-top:10px; font-size:13px;}
  .error-box{
    display:none;
    margin-top:16px;
    padding:14px 16px;
    background:#FDEDEC;
    border:1px solid #E6B0AA;
    border-radius:8px;
    color:#943126;
    font-size:14px;
  }
  /* ---------- Options ---------- */
  .options-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));
    gap:10px 22px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:14.5px;
  }
  .opt input{width:16px;height:16px; accent-color:var(--ocean);}
  .toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid var(--line);
  }
  select{
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 10px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
  }
  button.primary{
    background:var(--ocean);
    color:#fff;
    border:none;
    border-radius:7px;
    padding:11px 20px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  button.primary:hover{background:var(--ocean-deep);}
  button.primary:disabled{background:#B9C6CD; cursor:not-allowed;}
  
  .year-control{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  #yearSelect{min-width:90px;}

  /* ---------- Report ---------- */
  #report{display:none;}
  .section-title{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin:0 0 18px;
    padding-bottom:10px;
    border-bottom:2px solid var(--ocean);
  }
  .section-title h2{font-size:22px;}
  .season-banner{
    text-align:center;
    width:fit-content;
    margin:0 auto 28px;
    padding:16px 40px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 2px 8px rgba(15,58,87,0.12);
  }
  .season-banner .years{
    font-family:'Fraunces', serif;
    font-size:30px;
    color:var(--ocean);
    font-weight:600;
  }
  .season-banner .range{color:var(--gray); font-size:14.5px; margin-top:4px;}
  .hero-season-info{display:none;}
  table.report-table{
    width:100%;
    border-collapse:collapse;
    font-size:14.5px;
  }
  table.report-table th{
    background:var(--ocean);
    color:#fff;
    text-align:left;
    padding:9px 12px;
    font-weight:600;
  }
  table.report-table td{
    padding:8px 12px;
    border-bottom:1px solid var(--line);
  }
  table.report-table tr:nth-child(even) td{background:var(--lightblue); background:rgba(214,234,248,0.35);}
  table.report-table td.num, table.report-table th.num{text-align:right;}
  .group-pill{
    display:inline-block;
    font-size:12px;
    font-weight:600;
    padding:2px 9px;
    border-radius:99px;
    color:#fff;
  }
  .pill-Fish{background:var(--teal);}
  .pill-Mammal{background:var(--ocean);}
  .pill-Bird{background:var(--steel);}
  .pill-Other{background:var(--gray);}
  table.report-table th.sortable{cursor:pointer; user-select:none;}
  table.report-table th.sortable:hover{background:var(--ocean-deep);}
  table.report-table th.sortable .sort-arrow{margin-left:6px; font-size:10px; opacity:0.5; display:inline-block;}
  table.report-table th.sortable.sorted .sort-arrow{opacity:1;}
  .chart-wrap{
    position:relative;
    height:380px;
    margin-top:8px;
    overflow:hidden;
  }
  .chart-wrap canvas{
    width:100% !important;
    height:100% !important;
  }
  .chart-wrap.short{height:300px;}
  /* ---------- Seasonality (Merlin/eBird-style bar chart) ---------- */
  .szn-scroll{overflow-x:auto; margin-top:6px; border:1px solid var(--line); border-radius:8px;}
  .szn-table{border-collapse:collapse; width:100%; min-width:760px;}
  .szn-table td, .szn-table th{padding:0; border:none;}
  .szn-month-row th{
    font-size:11px; font-weight:700; color:#fff; background:var(--ocean);
    text-align:center; padding:5px 0; letter-spacing:0.02em;
    border-left:1px solid rgba(255,255,255,0.35);
  }
  .szn-month-row th:first-child{border-left:none;}
  .szn-corner{background:var(--ocean-deep) !important; position:sticky; left:0; z-index:3;}
  .szn-species-cell{
    padding:3px 10px; white-space:nowrap; font-size:12.5px; text-align:left;
    background:#fff; position:sticky; left:0; z-index:2; border-right:1px solid var(--line);
  }
  .szn-row:nth-child(even) .szn-species-cell, .szn-row:nth-child(even) .szn-cell{background:#F3F8FB;}
  .szn-cell{
    position:relative; height:24px; min-width:11px;
    border-left:1px solid #fff; vertical-align:bottom;
  }
  .szn-bar{
    position:absolute; bottom:1px; left:1px; right:1px; border-radius:1px;
  }
  .szn-nodata{
    position:absolute; inset:1px;
    background-image:repeating-linear-gradient(45deg, #E2E6E9, #E2E6E9 2px, #F4F6F7 2px, #F4F6F7 4px);
  }
  .szn-legend{display:flex; flex-wrap:wrap; gap:16px; align-items:center; font-size:12.5px; color:var(--gray); margin-top:10px;}
  .szn-legend-swatch{display:inline-block; width:14px; height:14px; border-radius:2px; vertical-align:-2px; margin-right:5px;}
  .szn-legend-nodata{
    display:inline-block; width:14px; height:14px; border-radius:2px; vertical-align:-2px; margin-right:5px;
    background-image:repeating-linear-gradient(45deg, #E2E6E9, #E2E6E9 2px, #F4F6F7 2px, #F4F6F7 4px);
    border:1px solid var(--line);
  }
  .year-block{margin-bottom:34px;}
  .year-header{
    display:inline-block;
    background:var(--ocean);
    color:#fff;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18px;
    padding:5px 16px;
    border-radius:6px;
    margin-bottom:14px;
  }
  .trip-card{
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 18px;
    margin-bottom:16px;
    background:var(--paper);
  }
  .trip-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:16px;
    margin-bottom:16px;
  }
  .trip-grid .trip-card{margin-bottom:0;}
  @media (max-width:640px){
    .trip-grid{grid-template-columns:1fr;}
  }
  .trip-card h3{
    font-size:16px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .trip-date-pill{
    background:var(--ocean);
    color:#fff;
    font-size:13px;
    padding:3px 11px;
    border-radius:6px;
    font-family:'Source Sans 3', sans-serif;
    font-weight:600;
  }
  .trip-meta{
    font-size:13.5px;
    color:var(--gray);
    margin:8px 0 12px;
  }
  .trip-meta b{color:var(--ink);}
  .empty-note{
    font-style:italic;
    color:var(--gray);
    font-size:14px;
  }
  .metric-row td:first-child{font-weight:600; color:var(--ocean);}
  footer{
    text-align:center;
    color:var(--gray);
    font-size:13px;
    padding:30px 0 50px;
  }
  @media print{
    .card.controls, .dropzone-card{display:none !important;}
  }

  /* ---------- Condensed print layout ---------- */
  @media print{
    body{font-size:11px; line-height:1.3;}
    .wrap{margin:0 auto; padding:0 10px; max-width:100%;}
    .card{padding:10px 14px; margin-bottom:10px; border-radius:4px;}
    h1{font-size:22px !important;}
    h2{font-size:15px !important;}
    .section-title{margin:0 0 8px; padding-bottom:4px; gap:6px;}
    .season-banner{display:none !important;}
    .hero-season-info{
      display:inline-block;
      font-size:13px;
      font-weight:400;
      font-family:'Source Sans 3', sans-serif;
      color:var(--ink);
      margin-left:10px;
      vertical-align:middle;
    }
    .hero-season-info::before{content:'— ';}
    .season-banner .range{font-size:11px; margin-top:2px;}
    table.report-table{font-size:10px;}
    table.report-table th{padding:4px 6px;}
    table.report-table td{padding:3px 6px;}
    .metric-row td{padding:2px 6px;}
    .group-pill{font-size:9.5px; padding:1px 6px;}
    .chart-wrap{height:220px; margin-top:2px;}
    .chart-wrap.short{height:180px;}
    .trip-grid{gap:8px; margin-bottom:8px; grid-template-columns:repeat(3, 1fr);}
    .trip-card{padding:8px 10px; margin-bottom:8px; border-radius:5px;}
    .trip-card h3{font-size:11.5px; gap:4px;}
    .trip-date-pill{font-size:9.5px; padding:1px 6px;}
    .trip-meta{font-size:9px; margin:3px 0 5px;}
    .trip-card table.report-table{font-size:8.5px;}
    .trip-card table.report-table th{padding:2px 4px;}
    .trip-card table.report-table td{padding:2px 4px;}
    .trip-card .group-pill{font-size:8px; padding:0 4px;}
    .year-header{font-size:14px; padding:3px 10px; margin-bottom:8px;}
    .year-block{margin-bottom:14px;}
    details.hint{display:none;}
    .empty-note{font-size:11px;}
  }
</style>
</head>

function assignGroup(species){
  if (FISH_SPECIES.includes(species)) return "Fish";
  if (MAMMAL_SPECIES.includes(species)) return "Mammal";
  if (BIRD_SPECIES.includes(species)) return "Bird";
  return "Other";
}

/* ============================== Parsing helpers ============================== */
function parseDateHeader(h){
  const s = String(h).trim();
  let m = s.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2,4})$/);
  if (m){
    let [, mo, d, y] = m;
    y = y.length === 2 ? "20" + y : y;
    const dt = new Date(parseInt(y), parseInt(mo)-1, parseInt(d));
    if (!isNaN(dt)) return dt;
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m){
    const [, y, mo, d] = m;
    const dt = new Date(parseInt(y), parseInt(mo)-1, parseInt(d));
    if (!isNaN(dt)) return dt;
  }
  return null;
}

function parseClockTime(str){
  if (!str) return null;
  const s = String(str).trim();
  let m = s.match(/^(\d{1,2}):(\d{2})\s*([AaPp][Mm])?$/);
  if (m){
    let hh = parseInt(m[1]), mm = parseInt(m[2]);
    const ap = m[3] ? m[3].toUpperCase() : null;
    if (ap === "PM" && hh < 12) hh += 12;
    if (ap === "AM" && hh === 12) hh = 0;
    return hh + mm/60;
  }
  m = s.match(/^(\d{1,2})(\d{2})$/); // 1300 style
  if (m){
    return parseInt(m[1]) + parseInt(m[2])/60;
  }
  m = s.match(/^(\d{1,2})\s*([AaPp][Mm])$/); // "9 AM"
  if (m){
    let hh = parseInt(m[1]);
    const ap = m[2].toUpperCase();
    if (ap === "PM" && hh < 12) hh += 12;
    if (ap === "AM" && hh === 12) hh = 0;
    return hh;
  }
  return null;
}

function fmtDate(d, opts){
  if (!d) return "";
  return d.toLocaleDateString('en-US', opts || {month:'short', day:'numeric', year:'numeric'});
}
function median(arr){
  if (!arr.length) return 0;
  const s = [...arr].sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length % 2 ? s[mid] : (s[mid-1]+s[mid])/2;
}
function commas(n){ return Math.round(n).toLocaleString('en-US'); }
function pillClass(g){ return "pill-" + g.replace(/\s+/g,"-"); }

/* ============================== File handling ============================== */
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const filenameEl = document.getElementById('filename');
const errorBox = document.getElementById('errorBox');
const controlsCard = document.getElementById('controlsCard');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

function showError(msg){
  errorBox.style.display = 'block';
  errorBox.textContent = msg;
}
function clearError(){
  errorBox.style.display = 'none';
  errorBox.textContent = '';
}

function onParsed(results, label){
  try{
    STATE = processData(results.data, results.meta.fields);
    filenameEl.textContent = "Loaded " + label + " — " + STATE.trips.length + " trip(s), " + STATE.sightingsLong.length + " sighting records.";
    controlsCard.style.display = 'block';
    const yearHint = document.getElementById('yearHint');
    const years = [...new Set(STATE.trips.map(t => Number(t.year)))]
      .filter(y => Number.isFinite(y))
      .sort((a,b) => b-a);

    const yearSelect = document.getElementById('yearSelect');
    yearSelect.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');

    // Default to the current calendar year when it exists in the data;
    // otherwise use the most recent year available.
    const currentYear = new Date().getFullYear();
    yearSelect.value = String(
      years.includes(currentYear) ? currentYear : (years[0] ?? currentYear)
    );

    const nYears = years.length;
    const byYearCheckbox = document.getElementById('opt_byyear');
    byYearCheckbox.checked = nYears > 1;
    yearSelect.disabled = byYearCheckbox.checked;

    yearHint.textContent = nYears > 1
      ? ("(" + nYears + " years detected)")
      : "(single season detected)";

    const seasonalityCheckbox = document.getElementById('opt_seasonality');
    const updateSeasonalityAvailability = () => {
      seasonalityCheckbox.disabled = !byYearCheckbox.checked;
    };
    updateSeasonalityAvailability();

    // Selecting a year matters when Group by year is OFF.
    // The seasonality chart only makes sense when Group by year is ON,
    // since it pools sightings across years to show a month-by-month pattern.
    byYearCheckbox.onchange = () => {
      yearSelect.disabled = byYearCheckbox.checked;
      updateSeasonalityAvailability();
    };
    document.getElementById('report').style.display = 'none';
  } catch(err){
    console.error(err);
    showError("Couldn't process this data: " + err.message + ". Check that it matches the expected format described below.");
    controlsCard.style.display = 'none';
  }
}

/* ============================== CSV parsing ============================== */
/*
 * The source spreadsheet contains real blank/spacer columns.  PapaParse's
 * header:true turns those blank header cells into duplicate object keys,
 * which causes values in those columns to overwrite one another.
 *
 * Parse as a 2D grid first, preserve every physical column position, then
 * convert the grid to the object shape expected by processData().
 */
function parseGrid(textOrFile, label){
  Papa.parse(textOrFile, {
    header: false,
    skipEmptyLines: 'greedy',
    dynamicTyping: false,

    complete: results => {
      try {
        const grid = results.data;
        if (!grid || grid.length < 2) {
          throw new Error("The CSV contains insufficient data.");
        }

        // Row 0 is the spreadsheet header row.
        const rawHeaders = grid[0] || [];

        // Give every physical column a unique key. Real headers are kept
        // unchanged; blank header cells get position-based internal names.
        const fields = rawHeaders.map((value, index) => {
          const name = String(value ?? '').trim();
          return name || `__column_${index}`;
        });

        // Convert rows back to objects WITHOUT allowing blank cells to shift
        // the remaining columns. Missing cells are explicitly preserved as "".
        const rows = grid.slice(1).map(row => {
          const obj = {};
          fields.forEach((field, index) => {
            obj[field] = row[index] ?? '';
          });
          return obj;
        });

        onParsed({
          data: rows,
          meta: { fields }
        }, label);
      } catch(err) {
        console.error(err);
        showError("Couldn't process this data: " + err.message);
      }
    },

    error: err => showError("Couldn't parse the data: " + err.message)
  });
}

function handleFile(file){
  clearError();
  filenameEl.textContent = "Parsing " + file.name + " …";
  parseGrid(file, file.name);
}

/* ---- Load from a published Google Sheet CSV link ---- */
const sheetUrlInput = document.getElementById('sheetUrl');
const loadUrlBtn = document.getElementById('loadUrlBtn');

loadUrlBtn.addEventListener('click', () => {
  let url = sheetUrlInput.value.trim();
  if (!url) { showError("Paste a Google Sheet link first."); return; }
  clearError();

  // Extract spreadsheet ID and optional gid from whatever link format was pasted
  const idMatch = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
  const gidMatch = url.match(/[?&#]gid=(\d+)/);

  if (!idMatch) {
    showError("Couldn't find a spreadsheet ID in that link. Paste the normal edit link (docs.google.com/spreadsheets/d/…/edit).");
    return;
  }

  const sheetId = idMatch[1];
  const gid = gidMatch ? gidMatch[1] : "0";
  const gvizUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&gid=${gid}`;

  filenameEl.textContent = "Fetching sheet…";
  loadUrlBtn.disabled = true;

  fetch(gvizUrl)
    .then(resp => {
      if (!resp.ok) throw new Error("Server returned " + resp.status + " — make sure the sheet is shared as 'Anyone with the link can view'.");
      return resp.text();
    })
    .then(text => {
      if (/^\s*<(!DOCTYPE|html)/i.test(text)) {
        throw new Error("That link returned a web page, not CSV data — check sharing settings.");
      }
      parseGrid(text, "linked sheet");
    })
    .catch(err => {
      showError("Couldn't load that sheet (" + err.message + ").");
      filenameEl.textContent = "No file selected yet";
    })
    .finally(() => { loadUrlBtn.disabled = false; });
});
/* ============================== Data processing ============================== */
function processData(rows, fields){
  if (!fields || fields.length < 2) throw new Error("No columns found");
  const labelCol = fields[0];

  const dateCols = fields.slice(1).filter(f => parseDateHeader(f) !== null);
  if (dateCols.length === 0) throw new Error("No trip-date columns detected in the header row");

  const dateColMap = {};
  dateCols.forEach(c => dateColMap[c] = parseDateHeader(c));

  const norm = s => (s === undefined || s === null) ? "" : String(s).trim();

  function getMetaRow(label){
    const row = rows.find(r => norm(r[labelCol]) === label);
    const out = {};
    dateCols.forEach(c => out[c] = row ? norm(row[c]) : "");
    return out;
  }
  const meta = {};
  META_LABELS.forEach(l => meta[l] = getMetaRow(l));

  const trips = dateCols.map(dc => {
    const date = dateColMap[dc];
    return {
      dateCol: dc,
      date: date,
      year: String(date.getFullYear()),
      startTime: meta["Start Time"][dc],
      endTime: meta["End Time"][dc],
      tripType: meta["Type of trip"][dc],
      area: meta["Area Visited"][dc],
      seaState: meta["Sea State"][dc],
      visibility: meta["Visibility"][dc],
      observers: meta["Observers"][dc],
      birdPerson: meta["Bird person - name(s)"][dc],
      mammalPerson: meta["Mammal Person - names(s)"][dc]
    };
  }).sort((a,b) => a.date - b.date);

  // Species rows = any non-blank label that isn't a known metadata/summary row.
  // (We don't rely on a fixed Sort-order numeric range, since that range is
  // specific to one sheet's layout and shifts as species are added.)
  const speciesRows = rows.filter(r => {
    const label = norm(r[labelCol]);
    return label && !EXCLUDED_LABELS.has(label);
  });

  const tripByCol = {};
  trips.forEach(t => tripByCol[t.dateCol] = t);

  const sightingsLong = [];
  speciesRows.forEach(r => {
    const species = norm(r[labelCol]);
    dateCols.forEach(dc => {
      const raw = r[dc];
      const count = parseInt(raw, 10);
      if (!isNaN(count) && count > 0){
        const t = tripByCol[dc];
        sightingsLong.push({
          species, dateCol: dc, count,
          date: t.date, year: t.year, tripType: t.tripType, area: t.area,
          group: assignGroup(species)
        });
      }
    });
  });

  // trip-level species/animal totals
  const tripStats = {};
  trips.forEach(t => tripStats[t.dateCol] = {speciesSet:new Set(), total:0});
  sightingsLong.forEach(s => {
    tripStats[s.dateCol].speciesSet.add(s.species);
    tripStats[s.dateCol].total += s.count;
  });
  trips.forEach(t => {
    t.speciesCount = tripStats[t.dateCol].speciesSet.size;
    t.totalAnimals = tripStats[t.dateCol].total;
  });

  const dates = trips.map(t => t.date);
  const seasonStart = new Date(Math.min(...dates));
  const seasonEnd = new Date(Math.max(...dates));

  return { trips, sightingsLong, dateCols, seasonStart, seasonEnd };
}

/* ============================== Build / render ============================== */
document.getElementById('buildBtn').addEventListener('click', () => {
  if (!STATE) return;
  charts.forEach(c => c.destroy());
  charts = [];

  const byYear = document.getElementById('opt_byyear').checked;
  const selectedYear = document.getElementById('yearSelect').value;

  const opts = {
    overview: document.getElementById('opt_overview').checked,
    triplog: document.getElementById('opt_triplog').checked,
    median: document.getElementById('opt_median').checked,
    effort: document.getElementById('opt_effort').checked,
    totals: document.getElementById('opt_totals').checked,
    bytrip: document.getElementById('opt_bytrip').checked,
    seasonality: document.getElementById('opt_seasonality').checked
  };

  // When Group by year is OFF, report only the selected year.
  // When it is ON, retain all years and show the year breakdown.
  const reportState = byYear
    ? STATE
    : {
        ...STATE,
        trips: STATE.trips.filter(t => t.year === selectedYear),
        sightingsLong: STATE.sightingsLong.filter(s => s.year === selectedYear)
      };

  if (!reportState.trips.length) {
    showError("No trips found for " + selectedYear + ".");
    return;
  }

  clearError();
  renderReport(reportState, byYear, opts);
});

function renderReport(state, byYear, opts){
  // When "Group by year" is OFF, show only the most recent year in the
  // dataset. This keeps older seasons (such as 2024) out of the report
  // while still allowing the checkbox to expose all years when enabled.
  let reportState = state;
  if (!byYear) {
    const years = state.trips.map(t => Number(t.year)).filter(Number.isFinite);
    if (years.length) {
      const selectedYear = Math.max(...years);
      const trips = state.trips.filter(t => Number(t.year) === selectedYear);
      const dateCols = new Set(trips.map(t => t.dateCol));
      const sightingsLong = state.sightingsLong.filter(s => dateCols.has(s.dateCol));
      const dates = trips.map(t => t.date);
      reportState = {
        ...state,
        trips,
        sightingsLong,
        seasonStart: dates.length ? new Date(Math.min(...dates)) : state.seasonStart,
        seasonEnd: dates.length ? new Date(Math.max(...dates)) : state.seasonEnd
      };
    }
  }

  const { trips, sightingsLong, seasonStart, seasonEnd } = reportState;
  const report = document.getElementById('report');
  report.innerHTML = '';
  report.style.display = 'block';

  const totalTrips = trips.length;
  const nSpecies = new Set(sightingsLong.map(s=>s.species)).size;
  const nAnimals = sightingsLong.reduce((a,s)=>a+s.count,0);

  // ---- Season banner ----
  const banner = el('div', 'season-banner');
  banner.innerHTML = `<div class="years">${fmtDate(seasonStart,{month:'long',day:'numeric'})} – ${fmtDate(seasonEnd,{month:'long',day:'numeric',year:'numeric'})}</div>
                       <div class="range">Pelagic Trips Report</div>`;
  report.appendChild(banner);

  const heroSeasonInfo = document.getElementById('heroSeasonInfo');
  if (heroSeasonInfo){
    heroSeasonInfo.textContent = `${fmtDate(seasonStart,{month:'long',day:'numeric'})} – ${fmtDate(seasonEnd,{month:'long',day:'numeric',year:'numeric'})} · Pelagic Trips Report`;
  }

  // ---- Season overview ----
  if (opts.overview){
    const card = sectionCard('Season Overview');
    const rows = [
      ["Total Trips", String(totalTrips)],
      ["Species Observed", String(nSpecies)],
      ["Total Animals", commas(nAnimals)],
      ["Date Range", `${fmtDate(seasonStart,{month:'short',day:'numeric'})} – ${fmtDate(seasonEnd,{month:'short',day:'numeric',year:'numeric'})}`]
    ];
    const table = document.createElement('table');
    table.className = 'report-table';
    table.innerHTML = '<tbody>' + rows.map(r => `<tr class="metric-row"><td>${r[0]}</td><td class="num">${r[1]}</td></tr>`).join('') + '</tbody>';
    card.appendChild(table);
    report.appendChild(card);
  }

  // ---- Trip log ----
  if (opts.triplog){
    const card = sectionCard(byYear ? 'Season Log' : 'Trip Log');
    let table;
    if (byYear){
      const years = [...new Set(trips.map(t=>t.year))].sort();
      const yearRows = years.map(y => {
        const yTrips = trips.filter(t=>t.year===y);
        const ySightings = sightingsLong.filter(s=>s.year===y);
        const nSp = new Set(ySightings.map(s=>s.species)).size;
        const nAn = ySightings.reduce((a,s)=>a+s.count,0);
        const dMin = new Date(Math.min(...yTrips.map(t=>t.date)));
        const dMax = new Date(Math.max(...yTrips.map(t=>t.date)));
        return {year:y, nTrips:yTrips.length, nSpecies:nSp, nAnimals:nAn, dMin, dMax};
      });
      const yearColumns = [
        {key:'year', label:'Year', value:r=>r.year},
        {key:'nTrips', label:'# Trips', numeric:true, value:r=>r.nTrips},
        {key:'nSpecies', label:'# Species', numeric:true, value:r=>r.nSpecies},
        {key:'nAnimals', label:'# Animals', numeric:true, value:r=>r.nAnimals},
        {key:'dMin', label:'Date Range', value:r=>r.dMin.getTime()}
      ];
      table = makeSortableTable(yearColumns, yearRows, r => `<tr><td>${r.year}</td><td class="num">${r.nTrips}</td><td class="num">${r.nSpecies}</td><td class="num">${commas(r.nAnimals)}</td><td>${fmtDate(r.dMin,{month:'short',day:'numeric'})} – ${fmtDate(r.dMax,{month:'short',day:'numeric'})}</td></tr>`);
    } else {
      const tripColumns = [
        {key:'date', label:'Date', value:r=>r.date.getTime()},
        {key:'time', label:'Start / End', value:r=>r.startTime||''},
        {key:'tripType', label:'Trip Type', value:r=>r.tripType||''},
        {key:'area', label:'Area', value:r=>r.area||''},
        {key:'speciesCount', label:'# Species', numeric:true, value:r=>r.speciesCount||0},
        {key:'totalAnimals', label:'# Animals', numeric:true, value:r=>r.totalAnimals||0}
      ];
      table = makeSortableTable(tripColumns, trips, t => `<tr><td>${fmtDate(t.date)}</td><td>${t.startTime||''} – ${t.endTime||''}</td><td>${t.tripType||''}</td><td>${t.area||''}</td><td class="num">${t.speciesCount||0}</td><td class="num">${commas(t.totalAnimals||0)}</td></tr>`);
    }
    card.appendChild(table);
    report.appendChild(card);
  }

  // ---- Seasonality (Merlin/eBird-style bar chart) ----
  // Only meaningful when pooling multiple years, since it shows the
  // month-by-month pattern of occurrence across the whole dataset.
  if (opts.seasonality && byYear){
    const card = sectionCard('Species Seasonality');
    card.appendChild(buildSeasonalityChart(sightingsLong, trips));
    report.appendChild(card);
  }

  // ---- Median species count chart ----
  if (opts.median){
    const card = sectionCard('Median Species Count');
    const chartWrap = el('div', 'chart-wrap');
    const canvas = document.createElement('canvas');
    chartWrap.appendChild(canvas);
    card.appendChild(chartWrap);
    report.appendChild(card);
    buildMedianChart(canvas, reportState, byYear);
  }

  // ---- Species per hour chart ----
  if (opts.effort){
    const card = sectionCard('Species per Hour');
    const chartWrap = el('div', 'chart-wrap short');
    const canvas = document.createElement('canvas');
    chartWrap.appendChild(canvas);
    card.appendChild(chartWrap);
    report.appendChild(card);
    buildEffortChart(canvas, reportState, byYear);
  }

  // ---- Species totals ----
  if (opts.totals){
    const card = sectionCard('Species Summary (All Trips)');
    const totalsMap = {};
    sightingsLong.forEach(s => {
      const key = s.group + '||' + s.species;
      if (!totalsMap[key]) totalsMap[key] = {group:s.group, species:s.species, total:0, tripSet:new Set()};
      totalsMap[key].total += s.count;
      totalsMap[key].tripSet.add(s.dateCol);
    });
    let list = Object.values(totalsMap).map(r => ({
      group:r.group, species:r.species, total:r.total, trips:r.tripSet.size,
      pct: (r.tripSet.size/totalTrips*100)
    }));
    list.sort((a,b) => {
      const go = GROUP_ORDER.indexOf(a.group) - GROUP_ORDER.indexOf(b.group);
      if (go !== 0) return go;
      if (b.trips !== a.trips) return b.trips - a.trips;
      return a.species.localeCompare(b.species);
    });
    const totalsColumns = [
      {key:'group', label:'Group', value:r=>GROUP_ORDER.indexOf(r.group)},
      {key:'species', label:'Species', value:r=>r.species},
      {key:'total', label:'Total Count', numeric:true, value:r=>r.total},
      {key:'trips', label:'# Trips', numeric:true, value:r=>r.trips},
      {key:'pct', label:'% of Trips', numeric:true, value:r=>r.pct}
    ];
    const table = makeSortableTable(totalsColumns, list, r => `<tr><td><span class="group-pill ${pillClass(r.group)}">${r.group}</span></td><td>${r.species}</td><td class="num">${commas(r.total)}</td><td class="num">${r.trips}</td><td class="num">${r.pct.toFixed(1)}%</td></tr>`);
    card.appendChild(table);
    report.appendChild(card);
  }

  // ---- Sightings by trip ----
  if (opts.bytrip){
    const card = sectionCard('Sightings by Trip');
    card.style.paddingBottom = '90px';
    const cornerLogo = document.createElement('img');
    cornerLogo.src = 'data:image/png;base64,' + GRAY_LOGO_B64;
    cornerLogo.alt = 'Shoals Marine Laboratory';
    cornerLogo.className = 'corner-logo';
    card.appendChild(cornerLogo);
    if (byYear){
      const years = [...new Set(trips.map(t=>t.year))].sort();
      years.forEach(y => {
        const block = el('div', 'year-block');
        const head = el('div', 'year-header');
        head.textContent = y;
        block.appendChild(head);

        const yTrips = trips.filter(t=>t.year===y);
        const ySightings = sightingsLong.filter(s=>s.year===y);
        block.appendChild(sightingsTable(aggregateSightings(ySightings)));

        if (yTrips.length > 1){
          const grid = el('div', 'trip-grid');
          yTrips.forEach(t => grid.appendChild(tripCard(t, sightingsLong.filter(s=>s.dateCol===t.dateCol))));
          block.appendChild(grid);
        }
        card.appendChild(block);
      });
    } else {
      const grid = el('div', 'trip-grid');
      trips.forEach(t => grid.appendChild(tripCard(t, sightingsLong.filter(s=>s.dateCol===t.dateCol))));
      card.appendChild(grid);
    }
    report.appendChild(card);
  }

  report.scrollIntoView({behavior:'smooth', block:'start'});
}

/* ============================== Sortable tables ============================== */
function makeSortableTable(columns, rows, rowHtmlFn){
  const table = document.createElement('table');
  table.className = 'report-table sortable-table';
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  let sortKey = null, sortDir = 1;

  columns.forEach(col => {
    const th = document.createElement('th');
    th.classList.add('sortable');
    if (col.numeric) th.classList.add('num');
    th.innerHTML = `${col.label}<span class="sort-arrow">⇅</span>`;
    th.addEventListener('click', () => {
      if (sortKey === col.key){ sortDir *= -1; }
      else { sortKey = col.key; sortDir = 1; }
      renderBody();
      updateArrows();
    });
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  table.appendChild(tbody);

  function renderBody(){
    let data = rows;
    if (sortKey){
      const col = columns.find(c => c.key === sortKey);
      data = [...rows].sort((a,b) => {
        let av = col.value(a), bv = col.value(b);
        if (typeof av === 'string'){ av = av.toLowerCase(); bv = bv.toLowerCase(); }
        if (av < bv) return -1 * sortDir;
        if (av > bv) return 1 * sortDir;
        return 0;
      });
    }
    tbody.innerHTML = data.map(rowHtmlFn).join('');
  }

  function updateArrows(){
    const ths = headRow.querySelectorAll('th');
    columns.forEach((col, i) => {
      const arrow = ths[i].querySelector('.sort-arrow');
      const active = col.key === sortKey;
      ths[i].classList.toggle('sorted', active);
      arrow.textContent = active ? (sortDir === 1 ? '▲' : '▼') : '⇅';
    });
  }

  renderBody();
  updateArrows();
  return table;
}

function aggregateSightings(sightings){
  const map = {};
  sightings.forEach(s => {
    const key = s.group+'||'+s.species;
    if (!map[key]) map[key] = {group:s.group, species:s.species, count:0};
    map[key].count += s.count;
  });
  return Object.values(map).sort((a,b)=>{
    const go = GROUP_ORDER.indexOf(a.group)-GROUP_ORDER.indexOf(b.group);
    return go !== 0 ? go : a.species.localeCompare(b.species);
  });
}

function sightingsTable(list){
  if (list.length === 0){
    const p = el('p', 'empty-note');
    p.textContent = 'No sightings recorded.';
    return p;
  }
  const columns = [
    {key:'group', label:'Group', value:r=>GROUP_ORDER.indexOf(r.group)},
    {key:'species', label:'Species', value:r=>r.species},
    {key:'count', label:'Count', numeric:true, value:r=>r.count}
  ];
  return makeSortableTable(columns, list, r => `<tr><td><span class="group-pill ${pillClass(r.group)}">${r.group}</span></td><td>${r.species}</td><td class="num">${commas(r.count)}</td></tr>`);
}

function tripCard(t, sightings){
  const wrap = el('div', 'trip-card');
  const h = el('h3');
  h.innerHTML = `<span class="trip-date-pill">${fmtDate(t.date)}</span> ${t.area||''}`;
  wrap.appendChild(h);
  const meta = el('div', 'trip-meta');
  meta.innerHTML = `<b>Time:</b> ${t.startTime||'—'} – ${t.endTime||'—'} &nbsp;·&nbsp; <b>Type:</b> ${t.tripType||'—'} &nbsp;·&nbsp; <b>Sea State:</b> ${t.seaState||'—'} &nbsp;·&nbsp; <b>Visibility:</b> ${t.visibility||'—'}<br><b>Observers:</b> ${t.observers||'—'}`;
  wrap.appendChild(meta);
  const grouped = aggregateSightings(sightings);
  wrap.appendChild(sightingsTable(grouped));
  return wrap;
}

function sectionCard(title){
  const card = el('div', 'card');
  const st = el('div', 'section-title');
  st.innerHTML = `<h2>${title}</h2>`;
  card.appendChild(st);
  document.getElementById('report').appendChild(card);
  return card;
}

function el(tag, cls){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

/* ============================== Seasonality (Merlin/eBird-style bar chart) ============================== */
// Renders a species x week grid (4 bins per month, 48 total), pooling
// sightings across every year in the dataset. Bar height = the share of
// trips run in that week-of-year that recorded the species; a hatched
// cell means no trips were run in that window at all (like Merlin/eBird's
// "insufficient data" hatching), rather than the species being absent.
function buildSeasonalityChart(sightingsLong, trips){
  const MONTHS = ['May','Jun','Jul','Aug'];
  const FIRST_MONTH = 4; // May (0-indexed); chart covers May through end of August
  const BINS_PER_MONTH = 4;
  const N_MONTHS = MONTHS.length;
  const BINS = N_MONTHS * BINS_PER_MONTH;

  function binOf(date){
    const m = date.getMonth() - FIRST_MONTH;
    const day = date.getDate();
    const w = Math.min(BINS_PER_MONTH - 1, Math.floor((day - 1) / 7));
    return m * BINS_PER_MONTH + w;
  }

  // How many distinct trips fall in each week-bin, across all years.
  // Trips outside May–Aug produce a bin index outside [0, BINS) and are
  // simply not counted, since the chart only covers that window.
  const effort = new Array(BINS).fill(0);
  trips.forEach(t => { const b = binOf(t.date); if (b >= 0 && b < BINS) effort[b]++; });

  const speciesGroup = {};
  sightingsLong.forEach(s => { speciesGroup[s.species] = s.group; });
  const speciesList = Object.keys(speciesGroup);

  // occ[species][bin] = Set of trip dateCols where the species was recorded.
  const occ = {};
  speciesList.forEach(sp => { occ[sp] = new Array(BINS).fill(0).map(() => new Set()); });
  sightingsLong.forEach(s => {
    const b = binOf(s.date);
    if (b >= 0 && b < BINS) occ[s.species][b].add(s.dateCol);
  });

  const sortedSpecies = [...speciesList].sort((a, b) => {
    const go = GROUP_ORDER.indexOf(speciesGroup[a]) - GROUP_ORDER.indexOf(speciesGroup[b]);
    return go !== 0 ? go : a.localeCompare(b);
  });

  const wrap = el('div', 'szn-scroll');
  const table = document.createElement('table');
  table.className = 'szn-table';

  const thead = document.createElement('thead');
  const monthRow = document.createElement('tr');
  monthRow.className = 'szn-month-row';
  const corner = document.createElement('th');
  corner.className = 'szn-corner';
  monthRow.appendChild(corner);
  MONTHS.forEach(m => {
    const th = document.createElement('th');
    th.colSpan = BINS_PER_MONTH;
    th.textContent = m;
    monthRow.appendChild(th);
  });
  thead.appendChild(monthRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  sortedSpecies.forEach(sp => {
    const tr = document.createElement('tr');
    tr.className = 'szn-row';
    const nameCell = document.createElement('td');
    nameCell.className = 'szn-species-cell';
    nameCell.innerHTML = `<span class="group-pill ${pillClass(speciesGroup[sp])}" style="padding:1px 6px; font-size:9.5px; margin-right:6px;">${speciesGroup[sp][0]}</span>${sp}`;
    tr.appendChild(nameCell);

    for (let b = 0; b < BINS; b++){
      const td = document.createElement('td');
      td.className = 'szn-cell';
      const nTripsInBin = effort[b];
      if (nTripsInBin === 0){
        const nodata = document.createElement('div');
        nodata.className = 'szn-nodata';
        td.appendChild(nodata);
      } else {
        const nHits = occ[sp][b].size;
        if (nHits > 0){
          const freq = nHits / nTripsInBin;
          const bar = document.createElement('div');
          bar.className = 'szn-bar';
          bar.style.height = Math.max(freq * 100, 14) + '%';
          bar.style.background = GROUP_COLORS[speciesGroup[sp]];
          bar.title = `${sp}: ${Math.round(freq * 100)}% of trips that week (${nHits}/${nTripsInBin})`;
          td.appendChild(bar);
        }
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);

  const container = document.createElement('div');
  container.appendChild(wrap);

  const legend = el('div', 'szn-legend');
  legend.innerHTML = `
    <span><span class="szn-legend-swatch" style="background:${GROUP_COLORS.Fish}"></span>Fish</span>
    <span><span class="szn-legend-swatch" style="background:${GROUP_COLORS.Mammal}"></span>Mammal</span>
    <span><span class="szn-legend-swatch" style="background:${GROUP_COLORS.Bird}"></span>Bird</span>
    <span><span class="szn-legend-swatch" style="background:${GROUP_COLORS.Other}"></span>Other</span>
    <span><span class="szn-legend-nodata"></span>No trips run that week</span>
    <span style="flex-basis:100%;">Bar height = share of trips run in that week (pooled across all years) that recorded the species.</span>
  `;
  container.appendChild(legend);
  return container;
}

/* ============================== Charts ============================== */
function buildMedianChart(canvas, state, byYear){
  const { sightingsLong, trips, dateCols } = state;
  const allSpecies = [...new Set(sightingsLong.map(s=>s.species))];
  let medians; // [{species, group, median}]

  if (byYear){
    const years = [...new Set(trips.map(t=>t.year))];
    medians = allSpecies.map(sp => {
      const group = assignGroup(sp);
      const perYear = years.map(y => {
        return sightingsLong.filter(s=>s.species===sp && s.year===y).reduce((a,s)=>a+s.count,0);
      });
      return {species:sp, group, median: median(perYear)};
    });
  } else {
    medians = allSpecies.map(sp => {
      const group = assignGroup(sp);
      const perTrip = dateCols.map(dc => {
        return sightingsLong.filter(s=>s.species===sp && s.dateCol===dc).reduce((a,s)=>a+s.count,0);
      });
      return {species:sp, group, median: median(perTrip)};
    });
  }

  medians = medians.filter(m => m.median > 0);
  const top = [];
  GROUP_ORDER.forEach(g => {
    const inGroup = medians.filter(m=>m.group===g).sort((a,b)=>b.median-a.median).slice(0,3);
    top.push(...inGroup);
  });
  top.sort((a,b)=>{
    const go = GROUP_ORDER.indexOf(a.group)-GROUP_ORDER.indexOf(b.group);
    return go !== 0 ? go : b.median - a.median;
  });
  top.reverse(); // horizontal bar reads bottom-up

  const ch = new Chart(canvas, {
    type:'bar',
    data:{
      labels: top.map(t=>t.species),
      datasets:[{
        label:'Median count',
        data: top.map(t=>t.median),
        backgroundColor: top.map(t=>GROUP_COLORS[t.group]),
        borderRadius:4
      }]
    },
    options:{
      indexAxis:'y',
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        title:{display:true, text:'Median Count per ' + (byYear?'Year':'Trip') + ' by Species', color:'#1B4F72', font:{size:14, weight:'600', family:"'Fraunces', serif"}}
      },
      scales:{
        x:{ beginAtZero:true, grid:{color:'#E8F0F4'} },
        y:{ grid:{display:false} }
      }
    }
  });
  charts.push(ch);
}

function buildEffortChart(canvas, state, byYear){
  const { sightingsLong, trips } = state;
  const tripsWithEffort = trips.map(t => ({...t, effort: parseClockTime(t.endTime) - parseClockTime(t.startTime)}))
                                .map(t => ({...t, effort: (t.effort!=null && !isNaN(t.effort) && t.effort>0) ? t.effort : null}));

  let labels, datasets, totals;
  if (byYear){
    const years = [...new Set(trips.map(t=>t.year))].sort();
    const effortByYear = {};
    years.forEach(y => {
      effortByYear[y] = tripsWithEffort.filter(t=>t.year===y).reduce((a,t)=>a+(t.effort||0),0);
    });
    labels = years;
    datasets = GROUP_ORDER.map(g => ({
      label:g,
      data: years.map(y => {
        const nSp = new Set(sightingsLong.filter(s=>s.year===y && s.group===g).map(s=>s.species)).size;
        const eff = effortByYear[y];
        return eff ? nSp/eff : 0;
      }),
      backgroundColor: GROUP_COLORS[g],
      stack:'s'
    }));
    totals = years.map(y => datasets.reduce((a,d)=>a+d.data[years.indexOf(y)],0));
  } else {
    labels = trips.map(t=>fmtDate(t.date,{month:'short',day:'numeric'}));
    datasets = GROUP_ORDER.map(g => ({
      label:g,
      data: trips.map(t => {
        const nSp = new Set(sightingsLong.filter(s=>s.dateCol===t.dateCol && s.group===g).map(s=>s.species)).size;
        const eff = tripsWithEffort.find(x=>x.dateCol===t.dateCol).effort;
        return eff ? nSp/eff : 0;
      }),
      backgroundColor: GROUP_COLORS[g],
      stack:'s'
    }));
    totals = trips.map((t,i) => datasets.reduce((a,d)=>a+d.data[i],0));
  }

  const ch = new Chart(canvas, {
    data:{
      labels,
      datasets:[
        ...datasets.map(d => ({...d, type:'bar'})),
        { type:'line', label:'Total', data: totals, borderColor:'#1B4F72', backgroundColor:'#1B4F72', tension:0.25, pointRadius:4 }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{position:'bottom'},
        title:{display:true, text:'Species Richness per Unit Effort' + (byYear?' by Year':''), color:'#1B4F72', font:{size:14, weight:'600', family:"'Fraunces', serif"}}
      },
      scales:{
        x:{ stacked:true, grid:{display:false} },
        y:{ stacked:true, beginAtZero:true, title:{display:true, text:'Species / hour'}, grid:{color:'#E8F0F4'} }
      }
    }
  });
  charts.push(ch);
}
</script>
